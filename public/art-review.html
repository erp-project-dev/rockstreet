<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RockStreet · Galería</title><style>body{background:#090611;color:#eee;font:18px system-ui;margin:40px auto;max-width:1300px;padding:20px}h1{color:#43e9f1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:20px}article{background:#21152e;border:1px solid #574269;border-radius:12px;padding:16px}img{width:100%;border-radius:6px}a{color:#ffe14d;margin-right:14px}p{color:#b9b1cf}nav{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:24px}.props{display:flex;gap:20px}.props img{width:150px;height:160px;object-fit:contain}</style><h1>ROCKSTREET / GALERÍA DE ARTE</h1><nav><a href="/">Jugar</a><a href="enemies-preview.html">Enemigos y jefes</a><a href="axel-preview.html">Axel</a><a href="items-preview.html">Consumibles</a><a href="skills-preview.html">Habilidades</a><a href="/?artPreview=intro">Introducción</a><a href="/?artPreview=ending">Final</a><a href="/?artPreview=actors">Animaciones en Phaser</a><a href="combat-preview.html">Proyectiles y efectos</a></nav><p>Diez escenarios y sus imágenes de lore. Los enlaces de revisión directa usan una partida temporal en desarrollo.</p><div class="grid" id="grid"></div><h2>Objetos rompibles</h2><div class="props"><img src="assets/props/trash.png" alt="Bote de basura"><img src="assets/props/amp.png" alt="Amplificador"></div><script>const levels=[['garage','El Garage'],['club','Callejón del Club'],['arcade','Salón Arcade'],['vinyl','La Disquería'],['metro','Línea 86'],['studio','El Estudio'],['highway','La Autopista'],['label','La Disquera'],['academy','La Academia'],['stadium','La Coronación']];levels.forEach(([file,name],i)=>{const card=document.createElement('article');const title=document.createElement('h2');title.textContent=(i+1)+'. '+name;card.append(title);for(const folder of ['levels','lore']){const img=new Image();img.src='assets/'+folder+'/'+file+'.jpg';img.alt=folder==='levels'?'Fondo jugable de '+name:'Lore de '+name;card.append(img)}for(const [type,label] of [['level','Escenario'],['lore','Lore'],['boss','Jefe']]){const a=document.createElement('a');a.href='/?artPreview='+type+'-'+(i+1);a.textContent=label;card.append(a)}document.getElementById('grid').append(card)})</script></html>
