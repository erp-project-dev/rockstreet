<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RockStreet · Habilidades</title><style>body{background:#090611;color:#eee;font:18px system-ui;margin:40px auto;max-width:1100px;padding:20px}h1{color:#43e9f1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}article{background:#21152e;border:1px solid #574269;border-radius:12px;text-align:center;padding:16px}.big{width:180px;height:180px;object-fit:contain}.small{width:48px;height:48px;object-fit:contain}.muted{opacity:.35}.locked{filter:grayscale(1);opacity:.18}a{color:#ffe14d}p{color:#b9b1cf}</style><h1>ROCKSTREET / HABILIDADES</h1><p>Iconos finales con transparencia. Debajo: listo, sin energía y bloqueado a tamaño de HUD.</p><div class="grid" id="grid"></div><p><a href="/">Volver al juego</a></p><script>const icons=[['powerChord','Power Chord'],['feedback','Feedback'],['solo','Solo'],['pick-1','Púa · Plástico'],['pick-2','Púa · Nylon'],['pick-3','Púa · Celuloide'],['pick-4','Púa · Metal'],['pick-5','Púa · Oro']];for(const [file,name] of icons){const card=document.createElement('article');const heading=document.createElement('h3');heading.textContent=name;card.append(heading);for(const cls of ['big','small','small muted','small locked']){const img=new Image();img.src='assets/skills/'+file+'.png';img.alt=name;img.className=cls;card.append(img);if(cls==='big')card.append(document.createElement('br'))}document.getElementById('grid').append(card)}</script></html>
