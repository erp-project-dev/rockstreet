<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RockStreet · Efectos de combate</title><style>body{background:#0b0712;color:#eee;font:18px system-ui;padding:24px}h1{color:#43e9f1}a{color:#ffe14d}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}article{background:#21162b;border:1px solid #514063;border-radius:12px;padding:14px;text-align:center}canvas{background:repeating-conic-gradient(#171321 0% 25%,#221c2e 0% 50%) 50%/20px 20px}p{color:#b9afca}</style><h1>ROCKSTREET / PROYECTILES Y EFECTOS</h1><p>Arte grande y tamaño de aparición. Las físicas permanecen en el código del combate.</p><div class="grid" id="grid"></div><p id="status"></p><p><a href="/?artPreview=actors">Animaciones de todos los personajes</a> · <a href="/?artPreview=ending">Final</a> · <a href="/art-review.html">Galería</a></p><script>
const specs=[['projectiles','bottle','Botella',24,54],['projectiles','contract','Contrato',52,66],['projectiles','note','Nota hostil',52,64],['effects','impact','Impacto',92,92],['effects','wave','Power Chord',128,166],['effects','ring','Feedback',240,108],['effects','bolt','Solo',65,240]];
(async()=>{for(const [folder,name,label,w,h] of specs){const atlas=await fetch(`assets/${folder}/${name}-atlas.json`).then(r=>r.json());const image=new Image();image.src=`assets/${folder}/${name}.png`;await image.decode();const frame=atlas.frames['0'].frame;const article=document.createElement('article');const heading=document.createElement('h2');heading.textContent=label;article.append(heading);for(const small of [false,true]){const canvas=document.createElement('canvas');canvas.width=256;canvas.height=260;const width=small?w:Math.min(220,220*frame.w/frame.h),height=small?h:Math.min(220,220*frame.h/frame.w);canvas.getContext('2d').drawImage(image,frame.x,frame.y,frame.w,frame.h,(256-width)/2,(260-height)/2,width,height);article.append(canvas)}document.getElementById('grid').append(article)}document.getElementById('status').textContent='7 assets cargados.'})().catch(e=>document.getElementById('status').textContent=e.message);
</script></html>
