<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RockStreet · Consumibles</title><style>body{background:#090611;color:#eee;font:18px system-ui;margin:40px auto;max-width:1100px;padding:20px}h1{color:#43e9f1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}article{background:#21152e;border:1px solid #574269;border-radius:12px;text-align:center;padding:16px}.big{width:160px;height:160px;object-fit:contain}.floor{height:110px;background:#302a36;display:flex;align-items:end;justify-content:center;padding-bottom:14px}a{color:#ffe14d}p{color:#b9b1cf}</style><h1>ROCKSTREET / CONSUMIBLES</h1><p>Ilustración y tamaño de aparición en el suelo.</p><div class="grid" id="grid"></div><p><a href="/">Volver al juego</a></p><script>const items=[['coin','Moneda · $10',58],['bill','Billete · $50',90],['cash','Dinero · $200',98],['heartSmall','Vida · +25%',60],['heartBig','Vida completa',88],['energy','Stamina · +50%',82],['extraLife','Pase VIP · +1 vida',100],['goldRecord','Disco de oro · Daño ×2',80]];for(const [file,name,size] of items){const card=document.createElement('article');const heading=document.createElement('h3');heading.textContent=name;const img=new Image();img.src='assets/items/'+file+'.png';img.alt=name;img.className='big';const floor=document.createElement('div');floor.className='floor';const small=img.cloneNode();small.className='';small.style.width=size+'px';small.style.height=size+'px';small.style.objectFit='contain';floor.append(small);card.append(heading,img,floor);document.getElementById('grid').append(card)}</script></html>
