<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>RockStreet · Sonidos</title><style>body{background:#090611;color:#eee;font:18px system-ui;max-width:980px;margin:50px auto;padding:20px}h1{color:#ffe14d}p{color:#b9b1cf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}button{background:#21152e;border:1px solid #b04ab5;color:#fff;border-radius:8px;padding:18px;cursor:pointer}button:hover{border-color:#43e9f1}label{display:block;margin:25px 0}a{color:#43e9f1}</style><h1>ROCKSTREET / SFX</h1><p>Impactos, púas y recogida de ítems. Sin efectos de guitarra ni avisos de menú. Escucha cada efecto aquí y prueba su balance en combate.</p><label>Volumen <input id="volume" type="range" min="0" max="1" step=".05" value=".4"></label><div class="grid"><button data-name="hit-1">Impacto 1</button><button data-name="hit-2">Impacto 2</button><button data-name="hit-3">Impacto 3</button><button data-name="heavy">Golpe fuerte</button><button data-name="hurt">Daño recibido</button><button data-name="break">Objeto roto</button><button data-name="slam">Golpe al suelo</button><button data-name="pickThrow">Lanzar púa</button><button data-name="pickHit">Impacto de púa</button><button data-name="cash">Dinero</button><button data-name="heal">Vida</button><button data-name="energy">Energía</button><button data-name="life">Vida extra</button><button data-name="boost">Disco de oro</button></div><p id="status" aria-live="polite">Selecciona un sonido.</p><a href="/">Volver al juego</a><script>let current;document.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(current)current.pause();current=new Audio('assets/audio/sfx/'+b.dataset.name+'.wav?v=physical-1');current.volume=Number(document.getElementById('volume').value);current.play().catch(()=>{document.getElementById('status').textContent='No se pudo reproducir el sonido.'});document.getElementById('status').textContent=b.dataset.name;});document.getElementById('volume').oninput=e=>{if(current)current.volume=Number(e.target.value)};</script></html>
